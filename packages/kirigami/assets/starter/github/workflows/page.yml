name: Build & Deploy

env:
  TZ: America/Toronto

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write      # commit files the build regenerated
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: KiriBuild
        uses: php-kirigami/kiribuild@v2
        with:
          node-version: '24'

      - name: Commit regenerated files
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "kirigami[bot]"
            git config user.email "kirigami-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: update generated files [skip ci]"
            git push
          else
            echo "Nothing to commit."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

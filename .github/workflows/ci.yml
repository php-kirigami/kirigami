name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Native PHP with cURL: the TLS test also checks the CURL helper outside WASM.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, openssl
          coverage: none

      - run: npm ci

      - run: npm test
